name: Build Android APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Sync
        run: npx cap sync android
      - name: Generate app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0b1120" --iconBackgroundColorDark "#0b1120"

      - name: Copy VeloVpnPlugin into Android project
        run: |
          mkdir -p android/app/src/main/java/com/anto502/velovpn
          cp native/VeloVpnPlugin.kt android/app/src/main/java/com/anto502/velovpn/VeloVpnPlugin.kt
          cp native/TorEngineService.kt android/app/src/main/java/com/anto502/velovpn/TorEngineService.kt
      - name: Bump minSdkVersion for WireGuard
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle

      - name: Debug - list generated gradle files
        run: |
          echo "---- android/*.gradle* ----"
          find android -maxdepth 2 -iname "*.gradle*" -exec echo {} \;

      - name: Add Tor dependencies to app build.gradle
        run: |
          # Guardian Project's tor-android binary is hosted on their own maven
          # repo (gpmaven), not Maven Central and not JitPack. We're only
          # bootstrapping the Tor engine itself (local SOCKS proxy) — no
          # tun2socks/whole-device routing — so this is the only repo/dep set needed.
          if [ -f android/app/build.gradle ]; then
            GRADLE=android/app/build.gradle
            if ! grep -q "gpmaven" "$GRADLE"; then
              awk '{ if (/^android {/ && !r) {
                print "repositories {";
                print "    maven { url \x27https://raw.githubusercontent.com/guardianproject/gpmaven/master\x27 }";
                print "}";
                r=1
              } print }' "$GRADLE" > tmp_gradle
              mv tmp_gradle "$GRADLE"
            fi
            awk '{print} /^dependencies {/ && !x {
              print "    implementation \x27info.guardianproject:tor-android:0.4.8.18\x27";
              print "    implementation \x27info.guardianproject:jtorctl:0.4.5.7\x27";
              x=1
            }' "$GRADLE" > tmp_gradle
            mv tmp_gradle "$GRADLE"
          elif [ -f android/app/build.gradle.kts ]; then
            GRADLE=android/app/build.gradle.kts
            if ! grep -q "gpmaven" "$GRADLE"; then
              awk '{ if (/^android {/ && !r) {
                print "repositories {";
                print "    maven(url = \"https://raw.githubusercontent.com/guardianproject/gpmaven/master\")";
                print "}";
                r=1
              } print }' "$GRADLE" > tmp_gradle
              mv tmp_gradle "$GRADLE"
            fi
            awk '{print} /^dependencies {/ && !x {
              print "    implementation(\"info.guardianproject:tor-android:0.4.8.18\")";
              print "    implementation(\"info.guardianproject:jtorctl:0.4.5.7\")";
              x=1
            }' "$GRADLE" > tmp_gradle
            mv tmp_gradle "$GRADLE"
          fi

          echo "---- app/build.gradle(.kts) after patch ----"
          cat android/app/build.gradle 2>/dev/null || cat android/app/build.gradle.kts 2>/dev/null

      - name: Add WireGuard dependency to app build.gradle
        run: |
          if [ -f android/app/build.gradle ]; then
            GRADLE=android/app/build.gradle
            awk '{print} /^dependencies {/ && !x {print "    implementation \x27com.wireguard.android:tunnel:1.0.20260102\x27"; x=1}' "$GRADLE" > tmp_gradle.gradle
            mv tmp_gradle.gradle "$GRADLE"
          elif [ -f android/app/build.gradle.kts ]; then
            GRADLE=android/app/build.gradle.kts
            awk '{print} /^dependencies {/ && !x {print "    implementation(\"com.wireguard.android:tunnel:1.0.20260102\")"; x=1}' "$GRADLE" > tmp_gradle.gradle
            mv tmp_gradle.gradle "$GRADLE"
          fi

      - name: Add Kotlin support to Android project
        run: |
          if [ -f android/build.gradle ]; then
            PROJECT_GRADLE=android/build.gradle
            if ! grep -q "kotlin-gradle-plugin" "$PROJECT_GRADLE"; then
              sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'" "$PROJECT_GRADLE"
            fi
          elif [ -f android/build.gradle.kts ]; then
            PROJECT_GRADLE=android/build.gradle.kts
            if ! grep -q "kotlin-gradle-plugin" "$PROJECT_GRADLE"; then
              sed -i '/classpath("com.android.tools.build:gradle/a\        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")' "$PROJECT_GRADLE"
            fi
          fi

          if [ -f android/app/build.gradle ]; then
            APP_GRADLE=android/app/build.gradle
            if ! grep -q "kotlin-android" "$APP_GRADLE"; then
              sed -i "0,/apply plugin: 'com.android.application'/s//apply plugin: 'com.android.application'\\napply plugin: 'kotlin-android'/" "$APP_GRADLE"
            fi
            if ! grep -q "kotlin-stdlib" "$APP_GRADLE"; then
              sed -i "/^dependencies {/a\\    implementation \"org.jetbrains.kotlin:kotlin-stdlib:1.9.24\"" "$APP_GRADLE"
            fi
          elif [ -f android/app/build.gradle.kts ]; then
            APP_GRADLE=android/app/build.gradle.kts
            if ! grep -q "kotlin-android" "$APP_GRADLE"; then
              sed -i '0,/id("com.android.application")/s//id("com.android.application")\n    id("kotlin-android")/' "$APP_GRADLE"
            fi
            if ! grep -q "kotlin-stdlib" "$APP_GRADLE"; then
              sed -i '/^dependencies {/a\    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.24")' "$APP_GRADLE"
            fi
          fi

          echo "---- android/build.gradle(.kts) after patch ----"
          cat android/build.gradle 2>/dev/null || cat android/build.gradle.kts 2>/dev/null
          echo "---- android/app/build.gradle(.kts) after patch ----"
          cat android/app/build.gradle 2>/dev/null || cat android/app/build.gradle.kts 2>/dev/null

      - name: Register VeloVpnPlugin in MainActivity
        run: |
          MAIN=android/app/src/main/java/com/anto502/velovpn/MainActivity.java
          printf '%s\n' \
            'package com.anto502.velovpn;' \
            '' \
            'import android.os.Bundle;' \
            'import com.getcapacitor.BridgeActivity;' \
            '' \
            'public class MainActivity extends BridgeActivity {' \
            '    @Override' \
            '    public void onCreate(Bundle savedInstanceState) {' \
            '        registerPlugin(VeloVpnPlugin.class);' \
            '        super.onCreate(savedInstanceState);' \
            '    }' \
            '}' \
            > "$MAIN"

      

      - name: Add AdMob App ID to AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          awk '{if (/<\/application>/ && !x) {print "    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-4219488272694103~5061285797\"/>"; x=1} print}' "$MANIFEST" > tmp_manifest.xml
          mv tmp_manifest.xml "$MANIFEST"

      - name: Add POST_NOTIFICATIONS permission for VPN foreground service
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i "0,/<application/s//<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" \/>\n    <application/" "$MANIFEST"
          fi
          if ! grep -q "FOREGROUND_SERVICE\"" "$MANIFEST"; then
            sed -i "0,/<application/s//<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" \/>\n    <application/" "$MANIFEST"
          fi
          if ! grep -q "FOREGROUND_SERVICE_SPECIAL_USE" "$MANIFEST"; then
            sed -i "0,/<application/s//<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_SPECIAL_USE\" \/>\n    <application/" "$MANIFEST"
          fi

      - name: Register TorEngineService in AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "TorEngineService" "$MANIFEST"; then
            awk '{if (/<\/application>/ && !x) {
              print "    <service android:name=\".TorEngineService\" android:exported=\"false\" android:foregroundServiceType=\"specialUse\">";
              print "        <property android:name=\"android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE\" android:value=\"tor-proxy\" />";
              print "    </service>";
              x=1
            } print}' "$MANIFEST" > tmp_manifest.xml
            mv tmp_manifest.xml "$MANIFEST"
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velo-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
